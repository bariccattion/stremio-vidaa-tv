name: CI (tests)

# Test-only workflow: runs when the test suite, the probe, the workflow
# definitions, or Playwright config change — and never deploys. Deliberately
# separate from CI (site) so it can't cancel or delay an in-flight deploy.
#
# Mixed pushes (site + test paths) trigger both workflows; the changes job
# below makes this one stand down in that case, so CI (site) runs the suite
# exactly once per push.
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/probe-core.mjs'
      - '.github/workflows/**'
  push:
    branches: [development]
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/probe-core.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: development
          filters: |
            site:
              - 'upstream/**'
              - 'patches/**'
              - 'installer/**'
              - 'scripts/build.mjs'
              - 'UPSTREAM.lock.json'
              - 'package.json'
              - 'package-lock.json'

  test:
    needs: changes
    # Manual dispatches always run, regardless of paths.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.site != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site + run test suite
        run: npx playwright test

      - name: WASM core boot probe
        run: node scripts/probe-core.mjs

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tests
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
