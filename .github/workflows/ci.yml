name: CI

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Classify the changed paths once; test and deploy key off this.
    # - "site"  = anything that alters the built app/ (and thus gh-pages).
    # - "verify" = test/tooling-only changes: worth testing, nothing to deploy.
    # Docs, .gitignore, Dockerfile, sync tooling etc. trigger nothing.
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      verify: ${{ steps.filter.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: development
          filters: |
            site:
              - 'upstream/**'
              - 'patches/**'
              - 'installer/**'
              - 'scripts/build.mjs'
              - 'UPSTREAM.lock.json'
              - 'package.json'
              - 'package-lock.json'
            verify:
              - 'tests/**'
              - 'playwright.config.js'
              - 'scripts/probe-core.mjs'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    # Manual dispatches always run the full suite, regardless of paths.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.site == 'true' ||
      needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site + run test suite
        run: npx playwright test

      - name: WASM core boot probe
        run: node scripts/probe-core.mjs

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: test
    # Only redeploy when site content actually changed: every deploy rewrites
    # the sw.js cache name with the new commit, cache-busting every installed
    # TV — so test/doc-only pushes must not ship a new build.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development' &&
      needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: node scripts/build.mjs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          force_orphan: true
          commit_message: 'Deploy site from ${{ github.sha }}'
